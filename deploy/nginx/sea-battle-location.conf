# ============================================================================
#  ВСТАВИТЬ ВНУТРЬ server { server_name asolontsov.ru www.asolontsov.ru;
#  listen 443 ssl; ... }  — рядом с `location /` (сайт на 8081).
#
#  Страницу sea-battle.html вы кладёте в папку сайта ВНУТРИ контейнера
#  (docker cp) — её отдаёт ваше приложение на 8081, nginx в этом не участвует.
#  Этот блок нужен только для ассетов игры и WebSocket.
#
#  Ничего больше в конфиге менять не нужно:
#  - ни map $http_upgrade в контексте http (Upgrade/Connection заданы здесь же),
#  - ни ssl-блоки Certbot,
#  - ни client_max_body_size 20M,
#  - ни ваши блоки /api/, /service/..., /qr/, /create.
#
#  Перед вставкой проверьте, что префикс /sea-battle/ ещё не занят:
#      grep -rn "sea-battle" /etc/nginx/
#  и что порт 8102 свободен:
#      ss -ltn | grep 8102
# ============================================================================


# Редирект /sea-battle -> /sea-battle/ (человек набрал без слеша)
location = /sea-battle {
    return 301 /sea-battle/;
}


# --- Ассеты игры и WebSocket ------------------------------------------------
# ВАЖНО про слеш: из-за хвостового `/` в proxy_pass nginx СРЕЗАЕТ префикс
# location. Поэтому:
#     /sea-battle/ws      -> бэкенд получает /ws
#     /sea-battle/game.js -> бэкенд получает /game.js
# Без хвостового `/` бэкенд получил бы /sea-battle/game.js и отдал бы 404.
#
# Префикс /sea-battle/ не пересекается с /sea-battle.html: это разные пути,
# и точное совпадение отдаётся приложению, а этот префикс — бэкенду.

location /sea-battle/ {
    proxy_pass http://127.0.0.1:8102/;

    # WebSocket
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Заголовки
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Комнаты живут в памяти сервера: соединение может висеть часами.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Без буферизации: иначе WebSocket-кадры залипают в буфере nginx.
    proxy_buffering off;
    proxy_request_buffering off;
}
